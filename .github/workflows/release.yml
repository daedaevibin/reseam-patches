name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RESEAM_BIN: ${{ github.workspace }}/engine/reseam
      RESEAM_BUNDLE_KEY: ${{ github.workspace }}/bundle-signing.key
      RESEAM_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
      # Outside build/: Gradle deletes a task's outputs there when the task has no history, as on a fresh checkout.
      RESEAM_PATCHES_JSON_OUT: ${{ github.workspace }}/patches.json
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.0.${{ github.run_number }}
    steps:
      # Full history, so the release notes can list the commits since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Reseam CLI and signing key
        run: |
          mkdir -p engine
          version=$(sed -n 's/.*id("app.reseam.workspace") version "\(.*\)".*/\1/p' settings.gradle.kts)
          curl -fsSL -o engine/reseam https://cdn.reseam.app/engine/v$version/reseam-linux-x64
          chmod +x engine/reseam
          echo "${{ secrets.BUNDLE_SIGNING_KEY_B64 }}" | base64 -d > bundle-signing.key
          size=$(wc -c < bundle-signing.key)
          if [ "$size" -ne 32 ]; then
            echo "BUNDLE_SIGNING_KEY_B64 must decode to a 32-byte key, got $size bytes." >&2
            echo "Set it with: base64 -w0 ~/.reseam/bundle-signing.key | gh secret set BUNDLE_SIGNING_KEY_B64 -R <owner>/<repo>" >&2
            exit 1
          fi

      # The build adds this release to the latest index, so a clean checkout keeps the release history.
      - name: Download the latest release index
        run: |
          status=$(curl -sSL -o patches.json -w '%{http_code}' "$RESEAM_HOMEPAGE/releases/latest/download/patches.json")
          case $status in
            200) ;;
            404) rm patches.json ;;
            *) echo "latest patches.json returned $status" >&2; exit 1 ;;
          esac

      - name: Write the release notes from the commits since the previous release
        run: |
          range=$GITHUB_SHA
          if previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null); then range=$previous..$GITHUB_SHA; fi
          git log --no-merges --format='- %s' "$range" > release-notes.md
          echo "RESEAM_RELEASE_DESCRIPTION_FILE=$PWD/release-notes.md" >> "$GITHUB_ENV"

      - name: Build and stage the release
        run: |
          name=$(sed -n 's/^name = "\(.*\)"/\1/p' manifest.toml)
          export RESEAM_BUNDLE_URL="$RESEAM_HOMEPAGE/releases/download/$RELEASE_TAG/$name.reseam"
          ./gradlew bundle -PreleaseTag=$RELEASE_TAG --no-daemon

      - name: Publish the GitHub release
        run: |
          index=$(jq -rn --arg url "$RESEAM_HOMEPAGE/releases/latest/download/patches.json" '$url | @uri')
          gh release create "$RELEASE_TAG" build/reseam/*.reseam --title "$RELEASE_TAG" \
            --notes "[Add to Reseam Manager](https://reseam.app/add/?url=$index)" --generate-notes
